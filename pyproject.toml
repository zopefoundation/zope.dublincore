# Generated with zope.meta (https://zopemeta.readthedocs.io/) from:
# https://github.com/zopefoundation/meta/tree/master/src/zope/meta/pure-python
[build-system]
requires = [
    "setuptools >= 78.1.1,< 82",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "zope.dublincore"
version = "6.2.dev0"
description = "Zope Dublin Core implementation"
license = "ZPL-2.1"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development",
]
dynamic = ["readme"]
requires-python = ">=3.11"
authors = [
    {name = "Zope Foundation and contributors",email = "zope-dev@zope.dev"},
]
maintainers = [
    {name = "Plone Foundation and contributors",email = "zope-dev@zope.dev"},
]
dependencies = [
    "persistent",
    "pytz",
    "zope.annotation",
    "zope.component[zcml]",
    "zope.datetime",
    "zope.interface",
    "zope.lifecycleevent",
    "zope.location",
    "zope.schema",
    "zope.security[zcml]>=3.8",
]
keywords = ["metadata", "dublincore"]

[project.optional-dependencies]
test = [
    "zope.testing >= 3.8",
    "zope.testrunner >= 6.4",
    "zope.configuration",
    "BTrees",
    "zope.publisher",
]
docs = [
    "Sphinx",
    "repoze.sphinx.autointerface",
    "zope.testing",
]

[project.urls]
Documentation = "https://zopedublincore.readthedocs.io/"
Source = "http://github.com/zopefoundation/zope.dublincore"
Issues = "https://github.com/zopefoundation/zope.dublincore/issues"
Changelog = "https://raw.githubusercontent.com/zopefoundation/zope.dublincore/master/CHANGES.rst"

[tool.coverage.run]
branch = true
source = ["zope.dublincore"]

[tool.coverage.report]
fail_under = 92
precision = 2
ignore_errors = true
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "pragma: nocover",
    "except ImportError:",
    "raise NotImplementedError",
    "if __name__ == '__main__':",
    "self.fail",
    "raise AssertionError",
    "raise unittest.Skip",
]

[tool.coverage.html]
directory = "parts/htmlcov"

[tool.setuptools.dynamic]
readme = {file = ["README.rst", "CHANGES.rst"]}

[tool.zest-releaser]
create-wheel = false
extra-message = ""
upload-pypi = false
